<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="braketBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="carbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="hexGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 16 4.5 L 16 11.5 L 8 16 L 0 11.5 L 0 4.5 Z" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <rect width="600" height="450" fill="url(#braketBg)" />

  <!-- CAD Çizim Kılavuz Çizgileri & Izgara -->
  <line x1="80" y1="225" x2="520" y2="225" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.3" />
  <line x1="300" y1="60" x2="300" y2="390" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4 4" stroke-opacity="0.3" />

  <!-- 3D Aparat Gövdesi (Perspektif Köşe & Direk Braketi) -->
  <g transform="translate(160, 90)">
    <!-- Sol Açılı Kanat (Direk Sarma Yüzeyi) -->
    <polygon points="40,60 140,20 140,220 40,260" fill="url(#carbon)" stroke="#00f0ff" stroke-width="1.5" />
    <polygon points="40,60 140,20 140,220 40,260" fill="url(#hexGrid)" />

    <!-- Sağ Açılı Kanat -->
    <polygon points="140,20 240,60 240,260 140,220" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" />
    <polygon points="140,20 240,60 240,260 140,220" fill="url(#hexGrid)" />

    <!-- Çelik Kelepçe Geçiş Yuvaları (Clamp Slots) -->
    <rect x="60" y="70" width="35" height="10" rx="3" fill="#030712" stroke="#38bdf8" />
    <rect x="185" y="70" width="35" height="10" rx="3" fill="#030712" stroke="#38bdf8" />

    <rect x="60" y="140" width="35" height="10" rx="3" fill="#030712" stroke="#38bdf8" />
    <rect x="185" y="140" width="35" height="10" rx="3" fill="#030712" stroke="#38bdf8" />

    <rect x="60" y="210" width="35" height="10" rx="3" fill="#030712" stroke="#38bdf8" />
    <rect x="185" y="210" width="35" height="10" rx="3" fill="#030712" stroke="#38bdf8" />

    <!-- Kamera Montaj Ön Düzlemi (Universal Mounting Plate) -->
    <rect x="90" y="80" width="100" height="110" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Kablo Geçiş Boğazı (Center Cable Gland Hole) -->
    <circle cx="140" cy="135" r="22" fill="#030712" stroke="#00f0ff" stroke-width="2" />

    <!-- Evrensel Kamera Montaj Vida Delikleri (Hikvision/Dahua 4 Delik) -->
    <circle cx="110" cy="105" r="5" fill="#00f0ff" />
    <circle cx="170" cy="105" r="5" fill="#00f0ff" />
    <circle cx="110" cy="165" r="5" fill="#00f0ff" />
    <circle cx="170" cy="165" r="5" fill="#00f0ff" />

    <!-- Marka Kabartması -->
    <text x="140" y="205" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle">TRAKYA 3D PRO</text>
  </g>

  <!-- Ölçülendirme Çizgileri & Notlar (Engineering Blueprint Dimensions) -->
  <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6">
    <!-- Yatay Ölçü -->
    <line x1="180" y1="360" x2="420" y2="360" />
    <line x1="180" y1="355" x2="180" y2="365" />
    <line x1="420" y1="355" x2="420" y2="365" />
  </g>
  <text x="300" y="375" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">GENİŞLİK: 220 mm • PETG KARBON KOMPOZİT</text>

  <!-- Dayanım Rozeti -->
  <rect x="200" y="395" width="200" height="24" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="300" y="411" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">15 KG STATİK YÜK TESTİ • UV & YAĞMUR IP67</text>
</svg>
