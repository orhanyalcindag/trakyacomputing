<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="braketCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172e" />
      <stop offset="100%" stop-color="#030814" />
    </linearGradient>
    <linearGradient id="braketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="steelClamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Arka Plan -->
  <rect width="600" height="450" fill="url(#braketCanvas)" />

  <!-- Teknik Çizim / Blueprint Koordinat Çemberleri -->
  <circle cx="300" cy="210" r="140" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.3" />
  <circle cx="300" cy="210" r="80" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.25" />

  <!-- Direk Kesiti (Temsili Montaj Direği / Çelik Boru) -->
  <rect x="110" y="50" width="70" height="340" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <line x1="145" y1="50" x2="145" y2="390" stroke="#64748b" stroke-width="1" stroke-dasharray="5 5" />
  <text x="145" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">MONTAJ DİREĞİ (Ø 60-120mm)</text>

  <!-- 2x Paslanmaz Çelik Kelepçe (Stainless Steel Clamps) -->
  <rect x="100" y="105" width="130" height="18" rx="4" fill="url(#steelClamp)" stroke="#475569" stroke-width="1" />
  <circle cx="115" cy="114" r="3" fill="#0f172a" />
  <circle cx="215" cy="114" r="3" fill="#0f172a" />

  <rect x="100" y="295" width="130" height="18" rx="4" fill="url(#steelClamp)" stroke="#475569" stroke-width="1" />
  <circle cx="115" cy="304" r="3" fill="#0f172a" />
  <circle cx="215" cy="304" r="3" fill="#0f172a" />

  <!-- 3D YAZICI İLE ÜRETİLEN ÖZEL PETG BRAKET GÖVDESİ -->
  <!-- Arka Destek Tabanı -->
  <path d="M 175 90 L 250 120 L 250 300 L 175 330 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Konsol Çıkıntısı (Extruded Cantilever Arm) -->
  <polygon points="250,120 420,150 420,270 250,300" fill="url(#braketBody)" stroke="#00f0ff" stroke-width="2" />

  <!-- 3D Katman Çizgileri Simülasyonu (3D Print Layer Lines) -->
  <g stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.2">
    <line x1="250" y1="135" x2="420" y2="162" />
    <line x1="250" y1="150" x2="420" y2="174" />
    <line x1="250" y1="165" x2="420" y2="186" />
    <line x1="250" y1="180" x2="420" y2="198" />
    <line x1="250" y1="195" x2="420" y2="210" />
    <line x1="250" y1="210" x2="420" y2="222" />
    <line x1="250" y1="225" x2="420" y2="234" />
    <line x1="250" y1="240" x2="420" y2="246" />
    <line x1="250" y1="255" x2="420" y2="258" />
    <line x1="250" y1="270" x2="420" y2="270" />
  </g>

  <!-- Ön Evrensel Kamera Montaj Plakası (Universal CCTV Mounting Face) -->
  <rect x="410" y="140" width="85" height="140" rx="8" fill="url(#plateGrad)" stroke="#ffffff" stroke-width="2" />

  <!-- Kablo Çıkış Deliği (Center Waterproof Cable Gland) -->
  <circle cx="452" cy="210" r="24" fill="#0b172e" stroke="#00f0ff" stroke-width="2.5" />
  <circle cx="452" cy="210" r="14" fill="#0284c7" />

  <!-- Evrensel Kamera Montaj Yuvaları (4 Vida Delikleri) -->
  <circle cx="425" cy="160" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="480" cy="160" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="425" cy="260" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="480" cy="260" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Kabartma Marka Yazısı -->
  <text x="335" y="215" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900" letter-spacing="1">TRAKYA 3D PRO</text>
  <text x="335" y="232" fill="#e0f2fe" font-family="sans-serif" font-size="9" font-weight="bold">PETG CARBON REINFORCED</text>

  <!-- Lazer Ölçüm İşaretçileri (Engineering Callouts) -->
  <path d="M 452 110 L 452 135" stroke="#00f0ff" stroke-width="1.5" />
  <text x="452" y="100" fill="#00f0ff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">EVRENSEL KAMERA FLANŞI</text>

  <!-- Alt Dayanım & Standart Rozeti -->
  <rect x="140" y="380" width="320" height="28" rx="14" fill="#0f172a" stroke="#00f0ff" stroke-width="1" />
  <text x="300" y="398" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">15 KG STATİK YÜK KAPASİTESİ • IP67 SU GEÇİRMEZ</text>
</svg>
