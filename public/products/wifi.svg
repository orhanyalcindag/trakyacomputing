<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="wifiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="discGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
    <radialGradient id="blueRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00f0ff" />
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#wifiBg)" />

  <!-- Dairesel Tavan Tipi Disk Gövde (UniFi UFO Tasarımı) -->
  <g transform="translate(300, 210)">
    <!-- Dış Gölge -->
    <circle cx="0" cy="15" r="140" fill="#000000" fill-opacity="0.4" />

    <!-- Ana Beyaz Disk -->
    <circle cx="0" cy="0" r="135" fill="url(#discGrad)" stroke="#cbd5e1" stroke-width="2" />

    <!-- İnce Yiv Çizgisi -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.5" />

    <!-- İkonik Mavi LED Durum Halkası (UniFi Glow Ring) -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#blueRing)" stroke-width="4.5" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.8" />

    <!-- Merkez UniFi 'U' Logosu -->
    <circle cx="0" cy="0" r="40" fill="#f8fafc" />
    <text x="0" y="8" fill="#0284c7" font-family="sans-serif" font-size="24" font-weight="900" text-anchor="middle">U</text>

    <!-- WiFi 6 Dalga Yayılım Çizgileri -->
    <path d="M -90 -60 A 110 110 0 0 1 90 -60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.4" />
    <path d="M -110 -80 A 135 135 0 0 1 110 -80" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.3" />
  </g>

  <!-- Alt Bilgi Rozeti -->
  <rect x="150" y="380" width="300" height="26" rx="13" fill="#0f172a" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
  <text x="300" y="397" fill="#00f0ff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">UniFi 6 Pro • 5.3 Gbps • 350+ İstemci • PoE+</text>
</svg>
