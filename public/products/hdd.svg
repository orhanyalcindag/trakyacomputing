<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hddBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="metalHdd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#hddBg)" />

  <!-- 3.5 inç Metal Hard Disk Gövdesi -->
  <g transform="translate(170, 75)">
    <rect x="0" y="0" width="260" height="290" rx="10" fill="url(#metalHdd)" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Montaj Vida Yuvaları -->
    <circle cx="15" cy="20" r="4" fill="#1e293b" />
    <circle cx="245" cy="20" r="4" fill="#1e293b" />
    <circle cx="15" cy="270" r="4" fill="#1e293b" />
    <circle cx="245" cy="270" r="4" fill="#1e293b" />

    <!-- İç Metal Girintisi -->
    <rect x="20" y="30" width="220" height="230" rx="8" fill="#1e293b" />

    <!-- WD Purple Pro Mor Etiketi -->
    <rect x="30" y="45" width="200" height="130" rx="6" fill="url(#purpleGrad)" stroke="#c084fc" stroke-width="1.5" />
    
    <text x="45" y="75" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900">Western Digital.</text>
    <text x="45" y="105" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">WD Purple Pro</text>
    <text x="45" y="125" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="bold">Surveillance Hard Drive • AI Enabled</text>

    <rect x="45" y="135" width="65" height="24" rx="4" fill="#ffffff" />
    <text x="77" y="152" fill="#581c87" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">8 TB</text>

    <!-- Alt Mekanik Daire Disk Kabartması -->
    <circle cx="130" cy="215" r="32" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <circle cx="130" cy="215" r="10" fill="#334155" />
    <circle cx="130" cy="215" r="4" fill="#ffffff" />
  </g>

  <!-- Alt Bilgi Rozeti -->
  <rect x="150" y="390" width="300" height="26" rx="13" fill="#0f172a" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
  <text x="300" y="407" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">7/24 Kesintisiz • 7200 RPM • 64 Kamera AI Kayıt</text>
</svg>
