<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="mtChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#mtBg)" />

  <!-- Router Gövdesi -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="440" height="110" rx="6" fill="url(#mtChassis)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- MikroTik Marka -->
    <text x="30" y="35" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="900" letter-spacing="1">MikroTik</text>
    <text x="30" y="50" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">Cloud Router Switch CRS309</text>

    <!-- 8 Adet Gigabit Ethernet Portu -->
    <g transform="translate(180, 20)">
      <g fill="#0284c7" stroke="#38bdf8" stroke-width="0.8">
        <rect x="0" y="0" width="16" height="18" rx="2" />
        <rect x="22" y="0" width="16" height="18" rx="2" />
        <rect x="44" y="0" width="16" height="18" rx="2" />
        <rect x="66" y="0" width="16" height="18" rx="2" />
        <rect x="88" y="0" width="16" height="18" rx="2" />
        <rect x="110" y="0" width="16" height="18" rx="2" />
        <rect x="132" y="0" width="16" height="18" rx="2" />
        <rect x="154" y="0" width="16" height="18" rx="2" />
      </g>
      <text x="85" y="32" fill="#94a3b8" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">8x GIGABIT RJ45</text>
    </g>

    <!-- 2 Adet 10G SFP+ Fiber Yuvası -->
    <g transform="translate(370, 15)">
      <rect x="0" y="0" width="55" height="30" rx="3" fill="#030712" stroke="#00f0ff" stroke-width="1.2" />
      <rect x="6" y="5" width="18" height="20" rx="2" fill="#1e293b" />
      <rect x="28" y="5" width="18" height="20" rx="2" fill="#1e293b" />
      <circle cx="15" cy="15" r="2" fill="#00f0ff" />
      <circle cx="37" cy="15" r="2" fill="#00f0ff" />
      <text x="27" y="42" fill="#00f0ff" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">2x 10G SFP+</text>
    </g>

    <!-- Durum LED'leri ve Dokunmatik LCD Ekran Alanı -->
    <rect x="30" y="65" width="90" height="30" rx="3" fill="#030712" stroke="#475569" />
    <text x="75" y="83" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">RouterOS v7</text>

    <!-- Aktivite LED Çizgisi -->
    <g fill="#10b981" transform="translate(180, 75)">
      <circle cx="8" cy="0" r="2.5" />
      <circle cx="30" cy="0" r="2.5" />
      <circle cx="52" cy="0" r="2.5" />
      <circle cx="74" cy="0" r="2.5" />
      <circle cx="96" cy="0" r="2.5" fill="#00f0ff" />
      <circle cx="118" cy="0" r="2.5" fill="#00f0ff" />
      <circle cx="140" cy="0" r="2.5" />
      <circle cx="162" cy="0" r="2.5" />
    </g>
  </g>

  <!-- Alt Bilgi Rozeti -->
  <rect x="150" y="315" width="300" height="26" rx="13" fill="#0f172a" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
  <text x="300" y="332" fill="#00f0ff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">10Gbps SFP+ Uplink • Dual Boot RouterOS • Firewall</text>
</svg>
