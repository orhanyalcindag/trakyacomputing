<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="swBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="ciscoChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#swBg)" />

  <!-- 19'' Rack Kabinet Kulakçıkları (L/R Brackets) -->
  <rect x="50" y="160" width="30" height="120" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <circle cx="65" cy="180" r="4" fill="#030712" stroke="#64748b" />
  <circle cx="65" cy="260" r="4" fill="#030712" stroke="#64748b" />

  <rect x="520" y="160" width="30" height="120" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <circle cx="535" cy="180" r="4" fill="#030712" stroke="#64748b" />
  <circle cx="535" cy="260" r="4" fill="#030712" stroke="#64748b" />

  <!-- Switch Ana Gövde (1U Chassis) -->
  <rect x="80" y="170" width="440" height="100" rx="4" fill="url(#ciscoChassis)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Cisco Logo & Marka -->
  <g transform="translate(100, 190)">
    <!-- Cisco Köprü İkonu -->
    <line x1="0" y1="12" x2="0" y2="4" stroke="#00f0ff" stroke-width="2.5" />
    <line x1="6" y1="12" x2="6" y2="0" stroke="#00f0ff" stroke-width="2.5" />
    <line x1="12" y1="12" x2="12" y2="6" stroke="#00f0ff" stroke-width="2.5" />
    <line x1="18" y1="12" x2="18" y2="0" stroke="#00f0ff" stroke-width="2.5" />
    <line x1="24" y1="12" x2="24" y2="4" stroke="#00f0ff" stroke-width="2.5" />
    <text x="35" y="12" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="900">CISCO</text>
    <text x="0" y="28" fill="#94a3b8" font-family="sans-serif" font-size="8" font-weight="bold">BUSINESS CBS250-24P</text>
  </g>

  <!-- 24 Port Gigabit RJ45 Matrisi (Üst ve Alt Çift Sıra) -->
  <g transform="translate(220, 185)">
    <!-- 12 Adet Çiftli RJ45 Port Bloğu -->
    <!-- Üst Sıra 1-23 Tek Sayılar -->
    <g fill="#0284c7" stroke="#38bdf8" stroke-width="0.8">
      <rect x="0" y="0" width="14" height="16" rx="2" />
      <rect x="18" y="0" width="14" height="16" rx="2" />
      <rect x="36" y="0" width="14" height="16" rx="2" />
      <rect x="54" y="0" width="14" height="16" rx="2" />
      <rect x="72" y="0" width="14" height="16" rx="2" />
      <rect x="90" y="0" width="14" height="16" rx="2" />
      <rect x="108" y="0" width="14" height="16" rx="2" />
      <rect x="126" y="0" width="14" height="16" rx="2" />
      <rect x="144" y="0" width="14" height="16" rx="2" />
      <rect x="162" y="0" width="14" height="16" rx="2" />
      <rect x="180" y="0" width="14" height="16" rx="2" />
      <rect x="198" y="0" width="14" height="16" rx="2" />
    </g>

    <!-- Alt Sıra 2-24 Çift Sayılar -->
    <g fill="#0284c7" stroke="#38bdf8" stroke-width="0.8" transform="translate(0, 22)">
      <rect x="0" y="0" width="14" height="16" rx="2" />
      <rect x="18" y="0" width="14" height="16" rx="2" />
      <rect x="36" y="0" width="14" height="16" rx="2" />
      <rect x="54" y="0" width="14" height="16" rx="2" />
      <rect x="72" y="0" width="14" height="16" rx="2" />
      <rect x="90" y="0" width="14" height="16" rx="2" />
      <rect x="108" y="0" width="14" height="16" rx="2" />
      <rect x="126" y="0" width="14" height="16" rx="2" />
      <rect x="144" y="0" width="14" height="16" rx="2" />
      <rect x="162" y="0" width="14" height="16" rx="2" />
      <rect x="180" y="0" width="14" height="16" rx="2" />
      <rect x="198" y="0" width="14" height="16" rx="2" />
    </g>

    <!-- Port Aktivite LED Işıkları (Yeşil / Mavi) -->
    <g fill="#10b981" transform="translate(2, -6)">
      <circle cx="5" cy="0" r="2" />
      <circle cx="23" cy="0" r="2" />
      <circle cx="41" cy="0" r="2" />
      <circle cx="59" cy="0" r="2" fill="#00f0ff" />
      <circle cx="77" cy="0" r="2" />
      <circle cx="95" cy="0" r="2" />
      <circle cx="113" cy="0" r="2" fill="#00f0ff" />
      <circle cx="131" cy="0" r="2" />
      <circle cx="149" cy="0" r="2" />
      <circle cx="167" cy="0" r="2" />
      <circle cx="185" cy="0" r="2" fill="#00f0ff" />
      <circle cx="203" cy="0" r="2" />
    </g>
  </g>

  <!-- 4 Adet SFP Fiber Optik Port Bloğu (Uplink) -->
  <g transform="translate(450, 185)">
    <rect x="0" y="0" width="55" height="42" rx="2" fill="#0b1329" stroke="#64748b" stroke-width="1" />
    <rect x="6" y="8" width="18" height="24" rx="2" fill="#1e293b" stroke="#00f0ff" />
    <rect x="28" y="8" width="18" height="24" rx="2" fill="#1e293b" stroke="#00f0ff" />
    <text x="27" y="52" fill="#00f0ff" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">4x SFP FIBER</text>
  </g>

  <!-- Alt Rozet Metni -->
  <rect x="150" y="310" width="300" height="26" rx="13" fill="#0f172a" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" />
  <text x="300" y="327" fill="#00f0ff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">24x Gigabit PoE+ (195W) • 4x SFP Uplink • Managed</text>
</svg>
