<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nvrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="frontPanel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#nvrBg)" />

  <!-- NVR 1U Metalik Gövde -->
  <!-- Perspektif Üst Kapak -->
  <polygon points="100,160 500,160 460,110 140,110" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  
  <!-- NVR Ön Panel (Front Bezel) -->
  <rect x="100" y="160" width="400" height="150" rx="6" fill="url(#frontPanel)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Sol Marka Alanı -->
  <text x="130" y="200" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="900" letter-spacing="1">HIKVISION</text>
  <text x="130" y="220" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">16 CHANNEL 4K SMART NVR</text>

  <!-- 16 Kanal LED Durum Işıkları (Matrix) -->
  <g transform="translate(130, 245)">
    <text x="0" y="-5" fill="#64748b" font-family="sans-serif" font-size="8" font-weight="bold">CHANNELS 1-16 (PoE ACTIVE)</text>
    <!-- 16 adet yanan minik yeşil LED -->
    <circle cx="8" cy="12" r="4" fill="#10b981" />
    <circle cx="28" cy="12" r="4" fill="#10b981" />
    <circle cx="48" cy="12" r="4" fill="#10b981" />
    <circle cx="68" cy="12" r="4" fill="#10b981" />
    <circle cx="88" cy="12" r="4" fill="#10b981" />
    <circle cx="108" cy="12" r="4" fill="#10b981" />
    <circle cx="128" cy="12" r="4" fill="#10b981" />
    <circle cx="148" cy="12" r="4" fill="#10b981" />
    <circle cx="168" cy="12" r="4" fill="#10b981" />
    <circle cx="188" cy="12" r="4" fill="#10b981" />
    <circle cx="208" cy="12" r="4" fill="#10b981" />
    <circle cx="228" cy="12" r="4" fill="#10b981" />
    <circle cx="248" cy="12" r="4" fill="#10b981" />
    <circle cx="268" cy="12" r="4" fill="#10b981" />
    <circle cx="288" cy="12" r="4" fill="#10b981" />
    <circle cx="308" cy="12" r="4" fill="#00f0ff" />
  </g>

  <!-- HDD & Sistem Durum Göstergesi -->
  <g transform="translate(410, 185)">
    <rect x="0" y="0" width="70" height="90" rx="4" fill="#0b1329" stroke="#334155" />
    <text x="35" y="20" fill="#94a3b8" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">STATUS</text>
    
    <circle cx="20" cy="40" r="5" fill="#10b981" />
    <text x="32" y="44" fill="#f8fafc" font-family="sans-serif" font-size="8">PWR</text>
    
    <circle cx="20" cy="60" r="5" fill="#38bdf8" />
    <text x="32" y="64" fill="#f8fafc" font-family="sans-serif" font-size="8">HDD</text>

    <circle cx="20" cy="80" r="5" fill="#10b981" />
    <text x="32" y="84" fill="#f8fafc" font-family="sans-serif" font-size="8">NET</text>
  </g>

  <!-- USB 3.0 Portu & Güç Tuşu -->
  <rect x="360" y="260" width="28" height="12" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
  <text x="374" y="285" fill="#64748b" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">USB 3.0</text>

  <!-- Alt Vurgu Bandı -->
  <rect x="150" y="340" width="300" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
  <text x="300" y="358" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">16x PoE Ports • 2x 10TB SATA • H.265+ 4K</text>
</svg>
