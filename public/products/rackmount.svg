<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="absMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#rackBg)" />

  <!-- 19 inç 1U Şasi Gövdesi -->
  <g transform="translate(60, 150)">
    <!-- Sol ve Sağ Rack Kulakları (19'' EIA-310 Standardı) -->
    <rect x="0" y="0" width="30" height="130" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="15" cy="20" r="5" fill="#030712" stroke="#94a3b8" />
    <circle cx="15" cy="110" r="5" fill="#030712" stroke="#94a3b8" />

    <rect x="450" y="0" width="30" height="130" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="465" cy="20" r="5" fill="#030712" stroke="#94a3b8" />
    <circle cx="465" cy="110" r="5" fill="#030712" stroke="#94a3b8" />

    <!-- 1U Ön Panel Çerçevesi -->
    <rect x="30" y="10" width="420" height="110" rx="6" fill="url(#absMetal)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Sol Mini-PC Yuvası (Tray 1) -->
    <rect x="50" y="25" width="170" height="80" rx="4" fill="#030712" stroke="#00f0ff" stroke-width="1" />
    <rect x="65" y="40" width="140" height="50" rx="3" fill="#1e293b" />
    <text x="135" y="65" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MINI-PC / CLIENT</text>
    <circle cx="80" cy="72" r="3" fill="#10b981" />
    <rect x="90" y="70" width="12" height="5" rx="1" fill="#0284c7" />

    <!-- Sağ Mini-PC / NVR Yuvası (Tray 2) -->
    <rect x="260" y="25" width="170" height="80" rx="4" fill="#030712" stroke="#00f0ff" stroke-width="1" />
    <rect x="275" y="40" width="140" height="50" rx="3" fill="#1e293b" />
    <text x="345" y="65" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">NVR / ROUTER</text>
    <circle cx="290" cy="72" r="3" fill="#00f0ff" />
    <rect x="300" y="70" width="12" height="5" rx="1" fill="#0284c7" />

    <!-- Petekli Havalandırma Izgaraları -->
    <g fill="#0284c7" fill-opacity="0.3">
      <circle cx="230" cy="40" r="2" />
      <circle cx="240" cy="40" r="2" />
      <circle cx="250" cy="40" r="2" />
      <circle cx="230" cy="50" r="2" />
      <circle cx="240" cy="50" r="2" />
      <circle cx="250" cy="50" r="2" />
      <circle cx="230" cy="60" r="2" />
      <circle cx="240" cy="60" r="2" />
      <circle cx="250" cy="60" r="2" />
      <circle cx="230" cy="70" r="2" />
      <circle cx="240" cy="70" r="2" />
      <circle cx="250" cy="70" r="2" />
      <circle cx="230" cy="80" r="2" />
      <circle cx="240" cy="80" r="2" />
      <circle cx="250" cy="80" r="2" />
    </g>

    <text x="240" y="112" fill="#64748b" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">AIRFLOW</text>
  </g>

  <!-- Alt Bilgi Rozeti -->
  <rect x="150" y="325" width="300" height="26" rx="13" fill="#0f172a" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
  <text x="300" y="342" fill="#00f0ff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">19 inç Standart 1U • Çiftli Montaj • Yanmaz PETG</text>
</svg>
